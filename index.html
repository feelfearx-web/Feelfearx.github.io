<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romashka Family</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Romashka Family</h1>
        <p>Собирайте ромашки на время! Наберите как можно больше очков за 60 секунд.</p>
        <div id="game">
            <canvas id="canvas" width="800" height="600"></canvas>
            <div id="hud">
                <span id="score">Очки: 0</span>
                <span id="timer">Время: 60</span>
            </div>
        </div>
        <button id="startButton">Начать игру</button>
        <div id="endScreen" style="display: none;">
            <h2>Игра окончена!</h2>
            <p>Ваши очки: <span id="finalScore"></span></p>
            <input type="text" id="playerName" placeholder="Ваше имя">
            <button id="saveScore">Сохранить результат</button>
        </div>
        <div id="leaderboard">
            <h2>Топ игроков</h2>
            <ol id="topPlayers"></ol>
            <p id="prizes" style="display: none;">Поздравляем топ-3! Каждый получает Lamborghini! (Виртуальный, конечно 😊)</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
